name: Excision BioTherapeutics
description: >-
  Excision BioTherapeutics is a clinical-stage biotechnology company developing
  CRISPR-based gene-editing therapies intended to functionally cure serious
  viral infectious diseases. Its programs use multiplexed CRISPR/Cas approaches
  delivered via adeno-associated virus (AAV) to excise latent viral DNA from
  infected cells, with a lead candidate (EBT-101) targeting HIV and additional
  research directed at herpesviruses and hepatitis B. The company was surfaced
  as a portfolio company of Battery Ventures and added to the API Evangelist
  network. As a therapeutics company it does not currently publish a public
  developer API, SDK, or documentation surface; this profile therefore carries
  company identity and domain-security posture rather than API artifacts.
